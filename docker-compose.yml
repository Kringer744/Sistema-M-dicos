version: "3.9"

# Modelo simplificado: 1 imagem (api+worker+frontend), Postgres e Redis.
# Roda local: `docker compose up -d`. Deploy: ver DEPLOY.md.

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medico
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trocar}
      POSTGRES_DB: sistema_medico
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      APP_MODE: both
      DATABASE_URL: postgresql+asyncpg://medico:${POSTGRES_PASSWORD:-trocar}@postgres:5432/sistema_medico
      REDIS_URL: redis://redis:6379/0
      UAZAPI_BASE_URL: ${UAZAPI_BASE_URL}
      UAZAPI_ADMIN_TOKEN: ${UAZAPI_ADMIN_TOKEN}
      UAZAPI_INSTANCE: ${UAZAPI_INSTANCE:-clinica}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SECRETARIA_TELEFONE: ${SECRETARIA_TELEFONE}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      TZ: America/Sao_Paulo
    volumes:
      - assinaturas:/data/assinaturas
    ports:
      - "8000:8000"

volumes:
  pg_data:
  assinaturas:
